<main style="display:block">
  <ul class="unit-list">

      </a>
    </li>
    <li>
      <a class="unit-card" href="beam/index.html">

    </li>
    <li>
      <a class="unit-card disabled" href="#" tabindex="-1">

    </li>
    <li>
      <a class="unit-card disabled" href="#" tabindex="-1">
        <h2>ねじり変形</h2>
        <p>準備中</p>
      </a>
    </li>
    <li>
      <a class="unit-card" href="mohr/index.html">
        <h2>モールの応力円</h2>
        <p>丸棒に引張・曲げ・ねじりを加え、任意の点の応力円を見る</p>
      </a>
    </li>
