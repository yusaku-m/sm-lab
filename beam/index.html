<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梁の学習プレイグラウンド</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="../common/style.css">
</head>
<body>
<header>
  <p class="home-link"><a href="../index.html">← sm-lab トップへ</a></p>
  <h1>梁の学習プレイグラウンド</h1>
  <p>支点・荷重を自由に配置すると、反力・せん断力図・曲げモーメント図がその場で再計算されます（材料力学Ⅰ・Ⅱの授業で使っている計算エンジンをそのままブラウザで動かしています）。</p>
</header>
<main>
  <section id="controls">
    <div class="controls-header">
      <h2>梁の定義</h2>
      <button id="toggle-controls" type="button" aria-expanded="true">折りたたむ ▲</button>
    </div>
    <div class="controls-body" id="controls-body">
      <div class="field">
        <label>梁の長さ L (mm)
          <input id="length" type="number" min="100" step="10" value="1000">
        </label>
      </div>

      <div class="group">
        <h2>支点 <button id="add-support" type="button">+ 追加</button></h2>
        <div id="supports-list"></div>
      </div>

      <div class="group">
        <h2>荷重 <button id="add-load" type="button">+ 追加</button></h2>
        <div id="loads-list"></div>
      </div>

      <div id="status"></div>
    </div>
  </section>

  <section id="outputs">
    <div class="fig-block">
      <h2>梁の構成</h2>
      <div class="fig-wrap" id="fig-beam"></div>
    </div>
    <div class="fig-block">
      <h2>反力</h2>
      <div class="fig-wrap" id="fig-reactions"></div>
      <div class="explanation" id="exp-reactions"></div>
    </div>
    <div class="fig-block">
      <h2>せん断力図（SFD）</h2>
      <div class="fig-wrap" id="fig-sfd"></div>
      <div class="explanation" id="exp-max-shear"></div>
    </div>
    <div class="fig-block">
      <h2>曲げモーメント図（BMD）</h2>
      <div class="fig-wrap" id="fig-bmd"></div>
      <div class="explanation" id="exp-sectional"></div>
    </div>
  </section>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
